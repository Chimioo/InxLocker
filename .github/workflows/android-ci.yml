name: Android CI

on:
  push:
    branches:
      - main
    paths:
      - "app/**"
  pull_request:
    branches: ["**"]
    paths:
      - "app/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses

      - name: Install Android SDK components
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Fix line endings
        run: |
          # Convert Windows line endings to Unix format
          sed -i 's/\r$//' ./gradlew
          chmod +x ./gradlew

      - name: Build release APK
        run: ./gradlew --no-daemon clean assembleRelease

      - name: 准备密钥库
        if: ${{ success() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false) }}
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${SIGNING_KEYSTORE_BASE64:-}" ]; then
            echo "未配置签名所需 Secrets,跳过生成密钥库文件";
            exit 0;
          fi
          echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > keystore.jks
          ls -l keystore.jks

      - name: 对齐并签名 APK
        if: ${{ success() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false) }}
        env:
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
        run: |
          set -euo pipefail
          BUILD_TOOLS_DIR="${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools/36.0.0"
          ZIPALIGN="$BUILD_TOOLS_DIR/zipalign"
          APKSIGNER="$BUILD_TOOLS_DIR/apksigner"
          if [ -z "${SIGNING_KEY_ALIAS:-}" ] || [ -z "${SIGNING_KEY_PASSWORD:-}" ] || [ -z "${SIGNING_STORE_PASSWORD:-}" ] || [ ! -f keystore.jks ]; then
            echo "未配置签名所需 Secrets,跳过签名";
            exit 0;
          fi
          ORIG_APK=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          echo "Release APK: $ORIG_APK"
          ALIGNED_APK="${ORIG_APK%.apk}-aligned.apk"
          # zipalign (if already aligned, fall back to copy)
          if [ -x "$ZIPALIGN" ]; then
            "$ZIPALIGN" -p -f 4 "$ORIG_APK" "$ALIGNED_APK" || cp "$ORIG_APK" "$ALIGNED_APK"
          else
            cp "$ORIG_APK" "$ALIGNED_APK"
          fi
          # replace original with aligned to keep original filename
          mv -f "$ALIGNED_APK" "$ORIG_APK"
          # apksigner
          "$APKSIGNER" sign \
            --ks keystore.jks \
            --ks-key-alias "$SIGNING_KEY_ALIAS" \
            --ks-pass pass:"$SIGNING_STORE_PASSWORD" \
            --key-pass pass:"$SIGNING_KEY_PASSWORD" \
            "$ORIG_APK"
          "$APKSIGNER" verify --print-certs "$ORIG_APK"
          echo "Release APK: $ORIG_APK"
          sha256sum "$ORIG_APK" || true

      - name: 验证 APK(非 fork 运行)
        if: ${{ success() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false) }}
        run: |
          BUILD_TOOLS_DIR="${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools/36.0.0"
          APKSIGNER="$BUILD_TOOLS_DIR/apksigner"
          FILE=$(ls app/build/outputs/apk/release/*.apk 2>/dev/null | head -n 1 || true)
          if [ ! -f "$FILE" ]; then
            echo "未找到 Release APK。" >&2
            exit 1
          fi
          # 验证 APK 签名;非零退出表示验证失败
          "$APKSIGNER" verify --print-certs "$FILE"

      - name: Upload APK artifact
        if: ${{ success() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false) }}
        uses: actions/upload-artifact@v4
        with:
          name: InxLocker-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Send APK to Telegram (optional)
        if: ${{ success() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false) }}
        continue-on-error: true
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BOT_CI_SESSION: ${{ secrets.TELEGRAM_BOT_CI_SESSION }}
          COMMIT_MESSAGE: ${{ format('{0}', github.event.head_commit.message) }}
          COMMIT_URL: ${{ github.event.head_commit.url }}
          ANOTHER: ${{ github.event.head_commit.author.name }}
        run: |
          if [ -z "${BOT_TOKEN:-}" ] || [ -z "${CHAT_ID:-}" ] || [ -z "${BOT_CI_SESSION:-}" ]; then
            echo "未配置 Telegram Secrets,跳过发送 APK";
            exit 0;
          fi
          FILE=$(ls app/build/outputs/apk/release/*.apk 2>/dev/null | head -n 1 || true)
          [ -f "$FILE" ] || exit 0
          pip install telethon aiohttp
          python3 .github/bot.py "$FILE"

  release:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: InxLocker-apk
          path: release-apk

      - name: Extract version info
        id: version
        run: |
          VERSION_NAME=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          VERSION_CODE=$(grep -oP 'versionCode\s*=\s*\K\d+' app/build.gradle.kts || echo "")
          if [ -z "$VERSION_CODE" ]; then
            VERSION_CODE=$(git rev-list --count HEAD)
          fi
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "tag=${VERSION_CODE}-${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "release_title=V${VERSION_NAME}(${VERSION_CODE})" >> "$GITHUB_OUTPUT"
          echo "Version: ${VERSION_NAME} (${VERSION_CODE})"

      - name: Generate changelog
        id: changelog
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -n "$LAST_TAG" ] && [ "$LAST_TAG" != "$TAG" ]; then
            CHANGELOG=$(git log "${LAST_TAG}..HEAD" --pretty=format:"- %s" --no-merges)
          else
            CHANGELOG=$(git log --pretty=format:"- %s" --no-merges -20)
          fi
          if [ -z "$CHANGELOG" ]; then
            CHANGELOG="- Initial release"
          fi
          echo "changelog<<EOF" >> "$GITHUB_OUTPUT"
          echo "$CHANGELOG" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Rename APK file
        run: |
          APK_FILE=$(ls release-apk/*.apk | head -n 1)
          VERSION_NAME="${{ steps.version.outputs.version_name }}"
          VERSION_CODE="${{ steps.version.outputs.version_code }}"
          NEW_NAME="InxLocker_${VERSION_NAME}(${VERSION_CODE}).apk"
          mv "$APK_FILE" "release-apk/${NEW_NAME}"
          echo "APK_PATH=release-apk/${NEW_NAME}" >> "$GITHUB_ENV"

      - name: Create release on Xposed-Modules-Repo
        env:
          GH_TOKEN: ${{ secrets.XP_REPO_PAT }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          TITLE="${{ steps.version.outputs.release_title }}"
          BODY="${{ steps.changelog.outputs.changelog }}"
          APK="${{ env.APK_PATH }}"

          if [ -z "${GH_TOKEN:-}" ]; then
            echo "未配置 XP_REPO_PAT,跳过发布到 Xposed-Modules-Repo"
            exit 0
          fi

          # Check if release already exists
          if gh release view "$TAG" --repo "Xposed-Modules-Repo/io.github.chimio.inxlocker" > /dev/null 2>&1; then
            echo "Release $TAG already exists, uploading APK asset..."
            gh release upload "$TAG" "$APK" \
              --repo "Xposed-Modules-Repo/io.github.chimio.inxlocker" \
              --clobber
          else
            echo "Creating new release $TAG..."
            gh release create "$TAG" \
              --repo "Xposed-Modules-Repo/io.github.chimio.inxlocker" \
              --title "$TITLE" \
              --notes "$BODY" \
              "$APK"
          fi
