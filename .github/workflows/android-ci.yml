name: Android CI

on:
  push:
    branches:
      - main
    paths:
      - "app/**"
  pull_request:
    branches: ["**"]
    paths:
      - "app/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses

      - name: Install Android SDK components
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Fix line endings
        run: |
          # Convert Windows line endings to Unix format
          sed -i 's/\r$//' ./gradlew
          chmod +x ./gradlew

      - name: 准备签名密钥库
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false }}
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "${SIGNING_KEYSTORE_BASE64:-}" ]; then
            echo "$SIGNING_KEYSTORE_BASE64" | base64 -d > keystore.jks
            echo "SIGNING_READY=true" >> "$GITHUB_ENV"
          fi

      - name: Build release APK
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false }}
        env:
          SIGNING_READY: ${{ env.SIGNING_READY }}
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          if [ "${SIGNING_READY:-}" = "true" ]; then
            KEYSTORE_PATH="$(pwd)/keystore.jks"
            ./gradlew --no-daemon clean assembleRelease \
              -Pandroid.injected.signing.store.file="$KEYSTORE_PATH" \
              -Pandroid.injected.signing.store.password="$SIGNING_STORE_PASSWORD" \
              -Pandroid.injected.signing.key.alias="$SIGNING_KEY_ALIAS" \
              -Pandroid.injected.signing.key.password="$SIGNING_KEY_PASSWORD"
          else
            ./gradlew --no-daemon clean assembleRelease
          fi

      - name: Upload APK artifact
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false }}
        uses: actions/upload-artifact@v4
        with:
          name: InxLocker-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Send APK to Telegram (optional)
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false }}
        continue-on-error: true
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BOT_CI_SESSION: ${{ secrets.TELEGRAM_BOT_CI_SESSION }}
          COMMIT_MESSAGE: ${{ format('{0}', github.event.head_commit.message) }}
          COMMIT_URL: ${{ github.event.head_commit.url }}
          ANOTHER: ${{ github.event.head_commit.author.name }}
        run: |
          if [ -z "${BOT_TOKEN:-}" ] || [ -z "${CHAT_ID:-}" ] || [ -z "${BOT_CI_SESSION:-}" ]; then
            echo "未配置 Telegram Secrets,跳过发送 APK";
            exit 0;
          fi
          FILE=$(ls app/build/outputs/apk/release/*.apk 2>/dev/null | head -n 1 || true)
          [ -f "$FILE" ] || exit 0
          pip install telethon aiohttp
          python3 .github/bot.py "$FILE"

  release:
    needs: build
    runs-on: ubuntu-latest
    if: needs.build.result == 'success' && github.ref == 'refs/heads/main'
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: InxLocker-apk
          path: release-apk

      - name: Extract version info
        id: version
        run: |
          VERSION_NAME=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          VERSION_CODE=$(grep -oP 'versionCode\s*=\s*\K\d+' app/build.gradle.kts || echo "")
          if [ -z "$VERSION_CODE" ]; then
            VERSION_CODE=$(git rev-list --count HEAD)
          fi
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "tag=${VERSION_CODE}-${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "release_title=V${VERSION_NAME}(${VERSION_CODE})" >> "$GITHUB_OUTPUT"
          echo "Version: ${VERSION_NAME} (${VERSION_CODE})"

      - name: Generate changelog
        id: changelog
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -n "$LAST_TAG" ] && [ "$LAST_TAG" != "$TAG" ]; then
            CHANGELOG=$(git log "${LAST_TAG}..HEAD" --pretty=format:"- %s" --no-merges)
          else
            CHANGELOG="- $(git log -1 --pretty=%s)"
          fi
          if [ -z "$CHANGELOG" ]; then
            CHANGELOG="- Initial release"
          fi
          echo "changelog<<EOF" >> "$GITHUB_OUTPUT"
          echo "$CHANGELOG" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Rename APK file
        run: |
          APK_FILE=$(ls release-apk/*.apk | head -n 1)
          VERSION_NAME="${{ steps.version.outputs.version_name }}"
          VERSION_CODE="${{ steps.version.outputs.version_code }}"
          NEW_NAME="InxLocker_${VERSION_NAME}(${VERSION_CODE}).apk"
          mv "$APK_FILE" "release-apk/${NEW_NAME}"
          echo "APK_PATH=release-apk/${NEW_NAME}" >> "$GITHUB_ENV"

      - name: Create release on this repo
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          TITLE="${{ steps.version.outputs.release_title }}"
          BODY="${{ steps.changelog.outputs.changelog }}"
          APK="${{ env.APK_PATH }}"

          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG already exists, uploading APK asset..."
            gh release upload "$TAG" "$APK" --clobber
          else
            echo "Creating new release $TAG..."
            gh release create "$TAG" \
              --title "$TITLE" \
              --notes "$BODY" \
              "$APK"
          fi

      - name: Create release on Xposed-Modules-Repo
        env:
          GH_TOKEN: ${{ secrets.XP_REPO_PAT }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          TITLE="${{ steps.version.outputs.release_title }}"
          BODY="${{ steps.changelog.outputs.changelog }}"
          APK="${{ env.APK_PATH }}"

          if [ -z "${GH_TOKEN:-}" ]; then
            echo "未配置 XP_REPO_PAT,跳过发布到 Xposed-Modules-Repo"
            exit 0
          fi

          if gh release view "$TAG" --repo "Xposed-Modules-Repo/io.github.chimio.inxlocker" > /dev/null 2>&1; then
            echo "Release $TAG already exists, uploading APK asset..."
            gh release upload "$TAG" "$APK" \
              --repo "Xposed-Modules-Repo/io.github.chimio.inxlocker" \
              --clobber
          else
            echo "Creating new release $TAG..."
            gh release create "$TAG" \
              --repo "Xposed-Modules-Repo/io.github.chimio.inxlocker" \
              --title "$TITLE" \
              --notes "$BODY" \
              "$APK"
          fi
